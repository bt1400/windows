name: Windows Kurulum Olustur
on:
  workflow_dispatch:
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Windows surumu (dosyadan yedek yukleme dahil)
        id: wfull
        continue-on-error: true
        shell: bash
        run: |
          flutter create --platforms=windows --org com.benim --project-name dosya_programi build_win
          cp pubspec_win.yaml build_win/pubspec.yaml
          rm -rf build_win/lib build_win/assets
          cp -r lib build_win/lib
          cp native_win/native.dart build_win/lib/native.dart
          cp -r assets build_win/assets
          cp windows_icon/app_icon.ico build_win/windows/runner/resources/app_icon.ico
          sed -i 's/set(BINARY_NAME "dosya_programi")/set(BINARY_NAME "IsTakip")/' build_win/windows/CMakeLists.txt
          sed -i 's/L"dosya_programi"/L"Is Takip"/' build_win/windows/runner/main.cpp
          sed -i 's/SW_SHOWNORMAL/SW_SHOWMAXIMIZED/' build_win/windows/runner/win32_window.cpp
          cd build_win
          flutter pub get
          flutter build windows --release
      - name: Temel Windows surumu (yukaridaki derlenmezse)
        if: steps.wfull.outcome != 'success'
        shell: bash
        run: |
          rm -rf build_win
          flutter create --platforms=windows --org com.benim --project-name dosya_programi build_win
          cp pubspec.yaml build_win/pubspec.yaml
          rm -rf build_win/lib build_win/assets
          cp -r lib build_win/lib
          cp -r assets build_win/assets
          cp windows_icon/app_icon.ico build_win/windows/runner/resources/app_icon.ico
          sed -i 's/set(BINARY_NAME "dosya_programi")/set(BINARY_NAME "IsTakip")/' build_win/windows/CMakeLists.txt
          sed -i 's/L"dosya_programi"/L"Is Takip"/' build_win/windows/runner/main.cpp
          sed -i 's/SW_SHOWNORMAL/SW_SHOWMAXIMIZED/' build_win/windows/runner/win32_window.cpp
          cd build_win
          flutter pub get
          flutter build windows --release
      - name: Paketle (internetsiz bilgisayar icin gerekli DLL'lerle)
        shell: pwsh
        run: |
          $rel = "build_win/build/windows/x64/runner/Release"
          foreach ($f in "msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll") {
            Copy-Item "C:\Windows\System32\$f" $rel -ErrorAction SilentlyContinue
          }
          New-Item -ItemType Directory -Force cikti | Out-Null
          Compress-Archive -Path "$rel/*" -DestinationPath cikti/IsTakip-Windows-Tasinabilir.zip
      - name: Kurulum programi olustur (Inno Setup)
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DSrcDir=$PWD\build_win\build\windows\x64\runner\Release" "/O$PWD\cikti" installer\is_takip.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-kurulum
          path: cikti/*
